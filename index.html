<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>لعبة كلمات القرآن</title>
  <style>
    :root{
      --correct:#538d4e;
      --present:#b59f3b;
      --absent:#3a3a3c;
      --default:#121213;
      --text:#ffffff;
      --border:#3a3a3c;
      --key-bg:#818384;

      /* Mobile-first sizing (iPhone) */
      --tile: 38px;
      --tile-font: 1.55rem;
      --tile-gap: 4px;
      --board-gap: 8px;
      --divider: 6px;

      --key-h: 44px;
      --key-font: 1.05rem;
      --kbd-gap: 6px;

      --header-h: 54px;
    }

    *{box-sizing:border-box}
    body{
      background-color:var(--default);
      color:var(--text);
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
      display:flex;
      flex-direction:column;
      align-items:center;
      margin:0;
      height:100vh;
      overflow:hidden;          /* no horizontal scroll */
      touch-action:manipulation;
    }

    /* Menu */
    #menu{
      position:absolute; inset:0;
      background:var(--default);
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      gap:14px;
      z-index:50;
      padding:0 14px;
      text-align:center;
    }
    .btn{
      padding:14px 30px;
      font-size:1.1rem;
      cursor:pointer;
      border:none;
      border-radius:12px;
      color:white;
      font-weight:800;
      width:100%;
      max-width:340px;
      font-family:inherit;
      background:#6b6b6d; /* gray */
    }

    /* Game container (mobile-first width) */
    #game-container{
      display:none;
      flex-direction:column;
      height:100%;
      width:100%;
      max-width:420px;          /* iPhone-friendly */
      position:relative;
      padding:0 env(safe-area-inset-right) 0 env(safe-area-inset-left);
    }

    header{
      height:var(--header-h);
      display:flex;
      align-items:center;
      justify-content:center;
      border-bottom:1px solid var(--border);
      font-weight:800;
      font-size:1.05rem;
      position:relative;
      padding:0 12px;
    }

    /* Exit button */
    #exit-btn{
      position:absolute;
      top:10px;
      left:12px;
      padding:10px 14px;
      font-size:1rem;
      font-weight:800;
      border:none;
      border-radius:12px;
      background:#2b2b2d;
      color:white;
      cursor:pointer;
      line-height:1;
    }
    #exit-btn:active{background:#3b3b3d}

    /* Boards area */
    .boards-container{
      flex:1;
      display:flex;
      justify-content:center;
      align-items:flex-start;
      padding:10px 10px 0 10px;
      overflow-y:auto;
      overflow-x:hidden;
      gap:var(--board-gap);
    }

    .board{
      display:grid;
      gap:var(--tile-gap);
      justify-content:center;
    }

    .tile{
      width:var(--tile);
      height:var(--tile);
      border:2px solid var(--border);
      display:flex;
      justify-content:center;
      align-items:center;
      font-size:var(--tile-font);
      font-weight:900;
      user-select:none;
    }

    .divider{
      width:var(--divider);
      height:var(--tile);
    }

    .tile.active{
      border-color:#888;
      box-shadow:0 0 5px #888;
    }
    .tile.filled{
      border-color:#565758;
      animation:pop 0.1s;
    }
    .correct{background-color:var(--correct); border-color:var(--correct); color:white;}
    .present{background-color:var(--present); border-color:var(--present); color:white;}
    .absent{background-color:var(--absent); border-color:var(--absent); color:white;}

    @keyframes pop{50%{transform:scale(1.07)}}
    @keyframes flip-in{
      0%{transform:rotateX(0)}
      50%{transform:rotateX(-90deg)}
      100%{transform:rotateX(0)}
    }

    /* Keyboard (mobile-first) */
    #keyboard{
      width:100%;
      padding:8px 8px calc(18px + env(safe-area-inset-bottom)) 8px;
      background-color:var(--default);
      display:flex;
      flex-direction:column;
      gap:var(--kbd-gap);
    }
    .key-row{
      display:flex;
      justify-content:center;
      width:100%;
      gap:6px;
    }
    .key{
      font-family:inherit;
      font-weight:900;
      border-radius:10px;
      cursor:pointer;
      background-color:var(--key-bg);
      color:white;
      flex:1;
      display:flex;
      justify-content:center;
      align-items:center;
      height:var(--key-h);
      font-size:var(--key-font);
      user-select:none;
      touch-action:manipulation;
      transition:background-color 0.1s;
    }
    .key:active{background-color:#aeb1b3}
    .key-wide{flex:1.55; font-size:0.95rem}

    /* Toasts */
    #message-area{
      position:fixed;
      top:10%;
      left:50%;
      transform:translateX(-50%);
      display:flex;
      flex-direction:column;
      gap:10px;
      z-index:100;
      pointer-events:none;
    }
    .toast{
      background:white;
      color:black;
      padding:10px 18px;
      border-radius:10px;
      font-weight:900;
      opacity:0.95;
      max-width:90vw;
      text-align:center;
    }

    /* Scale up for bigger screens (tablet/desktop) */
    @media (min-width: 480px){
      :root{
        --tile: 44px;
        --tile-font: 1.7rem;
        --tile-gap: 5px;
        --divider: 8px;

        --key-h: 48px;
        --key-font: 1.1rem;

        --header-h: 58px;
      }
      #game-container{max-width:560px;}
    }
    @media (min-width: 768px){
      :root{
        --tile: 52px;
        --tile-font: 2rem;
        --tile-gap: 6px;
        --divider: 10px;

        --key-h: 54px;
        --key-font: 1.2rem;
      }
      #game-container{max-width:720px;}
    }
  </style>
</head>

    <div id="keyboard"></div>

      "د ج ح خ ه ع غ ف ق ث ص ض",
      "ط ك م ن ت ا ل ب ي س ش",
      "ظ ز و ة ى ر ؤ ء ذ"
    ];

    // ===========================
    // منطق اللعبة
    // ===========================
    let state = {
      mode: "easy",
      wordLength: 5,
      maxGuesses: 6,
      currentGuess: "",
      guesses: [],
      targets: [],
      boardsSolved: [false, false],
      isAnimating: false,
      gameOver: false
    };

    function getRandomWord(list) {
      return list[Math.floor(Math.random() * list.length)];
    }

    function goToMenu() {
      // يرجع للصفحة الرئيسية بدون إعادة تحميل
      state.gameOver = true;
      document.getElementById("game-container").style.display = "none";
      document.getElementById("menu").style.display = "flex";
      document.getElementById("boards-container").innerHTML = "";
      document.getElementById("keyboard").innerHTML = "";
    }

    function startGame(mode) {
      state.mode = mode;
      state.guesses = [];
      state.currentGuess = "";
      state.boardsSolved = [false, false];
      state.isAnimating = false;
      state.gameOver = false;

      document.getElementById("menu").style.display = "none";
      document.getElementById("game-container").style.display = "flex";

      if (mode === "easy") {
        state.wordLength = 5;
        state.maxGuesses = 6;
        state.targets = [getRandomWord(words_5)];
      } else if (mode === "medium") {
        state.wordLength = 6;
        state.maxGuesses = 6;
        state.targets = [getRandomWord(words_6)];
      } else {
        state.wordLength = 6;
        state.maxGuesses = 7;
        let w1 = getRandomWord(words_6);
        let w2 = getRandomWord(words_6);
        while (w1 === w2) w2 = getRandomWord(words_6);
        state.targets = [w1, w2];
      }

      buildBoards();
      buildKeyboard();
      updateGrid();
    }

    // ====== بناء اللوحة ======
    function buildBoards() {
      const container = document.getElementById("boards-container");
      container.innerHTML = "";

      // السهل/المتوسط: لوحة واحدة عادية
      if (state.mode !== "hard") {
        const boardDiv = document.createElement("div");
        boardDiv.className = "board";
        boardDiv.style.gridTemplateColumns = `repeat(${state.wordLength}, 1fr)`;

        for (let r = 0; r < state.maxGuesses; r++) {
          for (let c = 0; c < state.wordLength; c++) {
            const tile = document.createElement("div");
            tile.className = "tile";
            tile.id = `b0-r${r}-c${c}`;
            boardDiv.appendChild(tile);
          }
        }
        container.appendChild(boardDiv);
        return;
      }

      // الصعب: لوحة واحدة بعرض 12 حرف (6 + فاصل + 6) بدون سكرول يمين/يسار
      const boardDiv = document.createElement("div");
      boardDiv.className = "board";
      boardDiv.style.gridTemplateColumns = `repeat(${state.wordLength}, 1fr) 10px repeat(${state.wordLength}, 1fr)`;

      for (let r = 0; r < state.maxGuesses; r++) {
        // النصف الأول
        for (let c = 0; c < state.wordLength; c++) {
          const tile = document.createElement("div");
          tile.className = "tile";
          tile.id = `b0-r${r}-c${c}`;
          boardDiv.appendChild(tile);
        }
        // فاصل
        const divi = document.createElement("div");
        divi.className = "divider";
        boardDiv.appendChild(divi);

        // النصف الثاني (نخزنها بأرقام أعمدة 6..11)
        for (let c = 0; c < state.wordLength; c++) {
          const tile = document.createElement("div");
          tile.className = "tile";
          tile.id = `b0-r${r}-c${c + state.wordLength}`;
          boardDiv.appendChild(tile);
        }
      }

      container.appendChild(boardDiv);
    }

    // ====== الكيبورد ======
    function buildKeyboard() {
      const kbd = document.getElementById("keyboard");
      kbd.innerHTML = "";

      keysLayout.forEach((rowStr, rowIndex) => {
        const rowDiv = document.createElement("div");
        rowDiv.className = "key-row";
        const chars = rowStr.split(" ");

        if (rowIndex === 2) {
          const enterKey = createKeyElement("تم", "Enter");
          enterKey.classList.add("key-wide");
          rowDiv.appendChild(enterKey);
        }

        chars.forEach(char => rowDiv.appendChild(createKeyElement(char, char)));

        if (rowIndex === 2) {
          const backKey = createKeyElement("⌫", "Backspace");
          backKey.classList.add("key-wide");
          rowDiv.appendChild(backKey);
        }

        kbd.appendChild(rowDiv);
      });
    }

    function createKeyElement(label, val) {
      const btn = document.createElement("div");
      btn.className = "key";
      btn.textContent = label;
      btn.setAttribute("data-key", val);
      btn.addEventListener("click", (e) => {
        e.preventDefault();
        handleInput(val);
      });
      return btn;
    }

    // ====== كيبورد الجهاز ======
    document.addEventListener("keydown", (e) => {
      if (state.gameOver) return;

      const key = e.key;
      if (key === "Enter") handleInput("Enter");
      else if (key === "Backspace") handleInput("Backspace");
      else {
        if (/^[\u0600-\u06FF]$/.test(key)) handleInput(key);
        else if (key === "أ" || key === "إ" || key === "آ") handleInput(key); // للتأكيد
      }
    });

    function handleInput(val) {
      if (state.isAnimating || state.gameOver) return;

      // استبدال فوري للحروف: أ/إ/آ -> ا
      if (val === "أ" || val === "إ" || val === "آ") val = "ا";

      if (val === "Enter") submitGuess();
      else if (val === "Backspace") {
        state.currentGuess = state.currentGuess.slice(0, -1);
        updateGrid();
      } else {
        if (arLen(state.currentGuess) < state.wordLength) {
          state.currentGuess += val;
          updateGrid();
        }
      }
    }

    // ====== تحديث الشبكة ======
    function clearActive() {
      document.querySelectorAll(".tile.active").forEach(t => t.classList.remove("active"));
    }

    function updateGrid() {
      const currentRow = state.guesses.length;
      clearActive();

      if (state.mode !== "hard") {
        for (let c = 0; c < state.wordLength; c++) {
          const tile = document.getElementById(`b0-r${currentRow}-c${c}`);
          const letter = Array.from(state.currentGuess)[c];
          tile.textContent = letter || "";

          if (letter) {
            tile.classList.add("filled");
            tile.style.borderColor = "#565758";
          } else {
            tile.classList.remove("filled");
            tile.style.borderColor = "var(--border)";
          }

          if (c === arLen(state.currentGuess)) tile.classList.add("active");
        }
        return;
      }

      // الصعب: نعرض نفس الإدخال في النصفين بنفس الوقت (6 + فاصل + 6)
      for (let c = 0; c < state.wordLength; c++) {
        const letter = Array.from(state.currentGuess)[c] || "";

        const leftTile  = document.getElementById(`b0-r${currentRow}-c${c}`);
        const rightTile = document.getElementById(`b0-r${currentRow}-c${c + state.wordLength}`);

        leftTile.textContent = letter;
        rightTile.textContent = letter;

        if (letter) {
          leftTile.classList.add("filled");
          rightTile.classList.add("filled");
          leftTile.style.borderColor = "#565758";
          rightTile.style.borderColor = "#565758";
        } else {
          leftTile.classList.remove("filled");
          rightTile.classList.remove("filled");
          leftTile.style.borderColor = "var(--border)";
          rightTile.style.borderColor = "var(--border)";
        }

        if (c === arLen(state.currentGuess)) {
          leftTile.classList.add("active");
          rightTile.classList.add("active");
        }
      }
    }

    // ====== إرسال التخمين ======
    function submitGuess() {
      if (arLen(state.currentGuess) !== state.wordLength) {
        showToast("الكلمة ناقصة");
        return;
      }

      state.currentGuess = normalizeArabic(state.currentGuess);

      if (arLen(state.currentGuess) !== state.wordLength) {
        showToast("الكلمة فيها رموز/حروف غير صالحة");
        return;
      }

      const dictSet = state.wordLength === 5 ? set5 : set6;
      if (!dictSet.has(state.currentGuess)) {
        showToast("الكلمة غير موجودة في القائمة");
        return;
      }

      state.isAnimating = true;
      const currentRow = state.guesses.length;
      const keyColorsUpdate = {};

      // عدد الأهداف: 1 في السهل/المتوسط، و2 في الصعب
      const targetsCount = (state.mode === "hard") ? 2 : 1;

      for (let b = 0; b < targetsCount; b++) {
        if (state.mode === "hard" && state.boardsSolved[b]) continue;

        const targetWord = state.targets[b];
        const guessArr = Array.from(state.currentGuess);
        const targetArr = Array.from(targetWord);
        const colors = new Array(state.wordLength).fill("absent");

        // correct
        guessArr.forEach((char, i) => {
          if (char === targetArr[i]) {
            colors[i] = "correct";
            targetArr[i] = null;
            keyColorsUpdate[char] = "correct";
          }
        });

        // present/absent
        guessArr.forEach((char, i) => {
          if (colors[i] !== "correct" && targetArr.includes(char)) {
            colors[i] = "present";
            targetArr[targetArr.indexOf(char)] = null;
            if (keyColorsUpdate[char] !== "correct") keyColorsUpdate[char] = "present";
          } else if (colors[i] === "absent") {
            if (!keyColorsUpdate[char]) keyColorsUpdate[char] = "absent";
          }
        });

        // تطبيق الأنميشن على مكانه الصحيح
        const baseCol = (state.mode === "hard") ? (b * state.wordLength) : 0;

        guessArr.forEach((char, i) => {
          const tile = document.getElementById(`b0-r${currentRow}-c${baseCol + i}`);
          setTimeout(() => {
            tile.style.animation = "flip-in 0.5s ease-in forwards";
            tile.style.borderColor = "transparent";
            setTimeout(() => tile.classList.add(colors[i]), 250);
          }, i * 250);
        });

        if (state.currentGuess === targetWord) {
          if (state.mode === "hard") state.boardsSolved[b] = true;
          else state.boardsSolved[0] = true;
        }
      }

      // في الصعب لازم نلون النصف الثاني بعد الفاصل أيضاً (نفس البلاطات اللي بنيناها 0..11)
      // الأنميشن فوق يغطي لأن baseCol يوزع: 0..5 و 6..11

      setTimeout(() => {
        applyKeyboardColors(keyColorsUpdate);
        state.guesses.push(state.currentGuess);
        state.currentGuess = "";
        state.isAnimating = false;

        checkGameStatus();
        if (!state.gameOver) updateGrid();
      }, state.wordLength * 250 + 550);
    }

    function applyKeyboardColors(updates) {
      for (const [char, status] of Object.entries(updates)) {
        const keyEl = document.querySelector(`.key[data-key="${char}"]`);
        if (!keyEl) continue;

        const currentClass =
          keyEl.classList.contains("correct") ? "correct" :
          keyEl.classList.contains("present") ? "present" : "absent";

        if (status === "correct") {
          keyEl.classList.remove("present", "absent");
          keyEl.classList.add("correct");
        } else if (status === "present" && currentClass !== "correct") {
          keyEl.classList.remove("absent");
          keyEl.classList.add("present");
        } else if (status === "absent" && !keyEl.classList.contains("correct") && !keyEl.classList.contains("present")) {
          keyEl.classList.add("absent");
        }
      }
    }

    function checkGameStatus() {
      if (state.mode !== "hard") {
        if (state.boardsSolved[0]) {
          state.gameOver = true;
          showToast("🎉 مبروك! أحسنت", 4500);
          return;
        }
      } else {
        const allSolved = state.boardsSolved[0] && state.boardsSolved[1];
        if (allSolved) {
          state.gameOver = true;
          showToast("🎉 مبروك! أحسنت", 4500);
          return;
        }
      }

      if (state.guesses.length >= state.maxGuesses) {
        state.gameOver = true;
        showToast(`حظ أوفر! الكلمة: ${state.targets.join(" و ")}`, 6000);
      }
    }

    function showToast(msg, duration = 2000) {
      const area = document.getElementById("message-area");
      const div = document.createElement("div");
      div.className = "toast";
      div.textContent = msg;
      area.appendChild(div);
      setTimeout(() => div.remove(), duration);
    }
  </script>
</body>
