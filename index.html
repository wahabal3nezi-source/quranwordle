<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#7f071f">
  <title>حجز موعد | د. منى بن علي</title>
  <meta name="description" content="احجزي موعدك مع د. منى بن علي بخطوات بسيطة وسريعة.">
  <link rel="icon" type="image/png" href="/assets/logo.png">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/" aria-label="الرئيسية">
      <img src="/assets/logo.png" alt="د. منى بن علي">
      <span>د. منى بن علي</span>
    </a>
    <a class="help" href="https://wa.me/96599577468">مساعدة عبر واتساب</a>
  </header>

  <main class="booking-page">
    <section class="booking-shell" aria-labelledby="bookingTitle">
      <div class="booking-head">
        <p class="eyebrow">حجز موعد</p>
        <h1 id="bookingTitle">اختاري موعدك بسهولة</h1>
        <p id="stepHint">ابدئي باختيار نوع الموعد.</p>
      </div>

      <div class="progress" aria-label="مراحل الحجز">
        <span class="progress-item active" data-progress="1">النوع</span>
        <span class="progress-item" data-progress="2">اليوم</span>
        <span class="progress-item" data-progress="3">الوقت</span>
        <span class="progress-item" data-progress="4">التأكيد</span>
      </div>
      <div class="stage active" data-stage="1">
        <div class="choice-list service-list">
          <button class="choice service-choice" data-service="consultation" type="button">
            <span><b>استشارة أونلاين</b><small>45 دقيقة عبر Zoom</small></span>
            <strong>45 د</strong>
          </button>
          <button class="choice service-choice" data-service="urgent" type="button">
            <span><b>استشارة مستعجلة</b><small>أولوية في تنسيق الموعد</small></span>
            <strong>80 د.ك</strong>
          </button>
          <button class="choice service-choice" data-service="course" type="button">
            <span><b>كاريزما الحضور</b><small>برنامج تدريبي عبر Zoom</small></span>
            <strong>20 د.ك</strong>
          </button>
        </div>
      </div>

      <div class="stage" data-stage="2">
        <div class="stage-title-row">
          <div><b>اختاري اليوم</b><small>اسحبي لرؤية الأيام التالية</small></div>
          <button class="back-btn" type="button" data-back="1">رجوع</button>
        </div>
        <div class="date-strip" id="dateStrip"></div>
      </div>

      <div class="stage" data-stage="3">
        <div class="stage-title-row">
          <div><b>اختاري الوقت</b><small id="chosenDateText"></small></div>
          <button class="back-btn" type="button" data-back="2">رجوع</button>
        </div>
        <div class="time-grid" id="timeGrid"></div>
      </div>
      <div class="stage" data-stage="4">
        <div class="stage-title-row">
          <div><b>آخر خطوة</b><small>نحتاج الاسم ورقم الجوال فقط</small></div>
          <button class="back-btn" type="button" data-back="3">رجوع</button>
        </div>

        <div class="summary" id="summaryBox"></div>

        <form id="bookingForm" class="details-form">
          <label>
            <span>الاسم</span>
            <input id="nameInput" name="name" autocomplete="name" placeholder="اكتبي اسمك" required>
          </label>
          <label>
            <span>رقم الجوال</span>
            <div class="phone-wrap"><span>+965</span><input id="phoneInput" name="phone" inputmode="numeric" autocomplete="tel" placeholder="XXXXXXXX" maxlength="8" required></div>
          </label>
          <button class="confirm-btn" type="submit">تأكيد طلب الحجز</button>
          <p class="privacy-note">بعدها يفتح واتساب برسالة جاهزة للتأكيد.</p>
        </form>
      </div>
    </section>
  </main>

  <script src="/app.js"></script>
</body>
</html>
